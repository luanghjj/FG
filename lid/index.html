<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leben in Deutschland · AzubiHub</title>
<style>
:root { color-scheme: light; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
header.lid-head { background: #123; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header.lid-head a.back { color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
header.lid-head a.back svg { width: 18px; height: 18px; }
header.lid-head h1 { font-size: 18px; margin: 0; }
main { max-width: 860px; margin: 0 auto; padding: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
.tabs { display: flex; gap: 8px; margin: 12px 0; }
.tabs button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; font-size: 15px; }
.tabs button svg { width: 18px; height: 18px; }
.tabs button.active { background: #123; color: #fff; border-color: #123; }
.panel { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px; }
.btn { display: inline-block; padding: 9px 16px; border-radius: 8px; border: 1px solid #123; background: #123; color: #fff; cursor: pointer; font-size: 15px; }
.btn.ghost { background: #fff; color: #123; }
.opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; font-size: 15px; }
.opt:disabled { cursor: default; opacity: .95; }
.opt.right { border-color: #1a7f37; background: #e6f4ea; }
.opt.wrong { border-color: #b42318; background: #fdecea; }
.q { font-weight: 600; margin: 10px 0 4px; }
.q-cat { color: #555; font-size: 13px; }
.q-feedback { margin: 8px 0; padding: 10px 12px; border-radius: 8px; background: #f1f5ff; border: 1px solid #c9d8ff; display: flex; gap: 8px; align-items: flex-start; }
.q-feedback svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.q-feedback.good { background: #e6f4ea; border-color: #a9d8b4; }
.q-feedback.bad { background: #fdecea; border-color: #f3b8b0; }
.note { margin: 10px 0; padding: 10px 12px; border-left: 4px solid #d4a017; background: #fffae6; border-radius: 0 8px 8px 0; }
.hint { color: #555; font-size: 13px; }
.err { color: #b42318; font-weight: 600; }
.res { font-size: 18px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.res svg { width: 22px; height: 22px; }
.res.pass { color: #1a7f37; }
.res.fail { color: #b42318; }
#examTimer { font-variant-numeric: tabular-nums; font-weight: 700; }
label.theme { display: block; margin: 4px 0; }
ul.tipps { padding-left: 20px; }
ul.tipps li { margin: 6px 0; }
</style>
</head>
<body>
<header class="lid-head">
  <a class="back" href="../index.html?choose=1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg>AzubiHub</a>
  <h1>Leben in Deutschland · AzubiHub</h1>
</header>
<main>
  <div class="row">
    <label for="lidLand">Bundesland:</label>
    <select id="lidLand"></select>
  </div>
  <nav class="tabs" aria-label="LiD Tabs">
    <button type="button" id="tabLernen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Lernen</button>
    <button type="button" id="tabTipps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/></svg>Tipps</button>
    <button type="button" id="tabPruefung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>Prüfung</button>
  </nav>
  <section class="panel" id="panelLernen">
    <div id="quizArea"></div>
  </section>
  <section class="panel" id="panelTipps" hidden>
    <div id="tippsArea"></div>
  </section>
  <section class="panel" id="panelPruefung" hidden>
    <div id="examArea"></div>
  </section>
</main>
<script src="data/lid-allg-p1.js"></script>
<script src="data/lid-allg-p2.js"></script>
<script src="data/lid-allg-p3.js"></script>
<script src="data/lid-allg-p4.js"></script>
<script src="data/lid-land-p1.js"></script>
<script src="data/lid-land-p2.js"></script>
<script src="data/lid-data.js"></script>
<script src="data/lid-quiz.js"></script>
<script src="data/lid-tipps.js"></script>
<script src="lid-exam.js"></script>
<script src="lid-app.js"></script>
</body>
</html>
