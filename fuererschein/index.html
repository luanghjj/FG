  <body>
<div id="root"></div>
    <script>
(function() {
  function injectBackBtn() {
    if (document.getElementById('lid-back-btn')) return;
    const header = document.querySelector('header');
    if (!header) return;
    
    let target = header.querySelector('.flex.items-center.gap-2.shrink-0') || 
                 header.querySelector('.flex.items-center.gap-1.shrink-0') ||
                 header.querySelector('div:last-child');
    
    const a = document.createElement('a');
    a.id = 'lid-back-btn';
    a.href = '../index.html?choose=1';
    a.className = 'lid-back-link';
    a.title = 'Quay lại danh mục chọn môn';
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg><span>Đổi môn</span>';
    
    if (target && target !== header) {
      target.appendChild(a);
    } else {
      header.appendChild(a);
    }
  }

  const observer = new MutationObserver(injectBackBtn);
  observer.observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('DOMContentLoaded', injectBackBtn);
  setTimeout(injectBackBtn, 300);
  setTimeout(injectBackBtn, 1000);
})();
</script>
</body>
